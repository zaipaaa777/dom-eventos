<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculador de IMC</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor">

        <h1>Calcular indice de masa corporal :</h1>

        <h3>Ingrese su peso en (Kg)</h3>
        
        <input id="peso" type="number" step="any">
        

        
        <h3>Ingrese su estatura en metros (ejemplo: 1.70): </h3>
        
        <input id="estatura" type="number" step="any">
        

        <button id="calculo">Calcular</button>

        <p id="resultado"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
